name: once-identity-cli

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch, commit, push, remove one-shot files
        run: |
          set -euo pipefail
          git apply --check scripts/_once_identity_cli.patch
          git apply scripts/_once_identity_cli.patch
          git config user.name "Fine_Computer_4451"
          git config user.email "119702188+FineComputer14451@users.noreply.github.com"
          git add bin/grokhunter scripts/ci-unit.sh
          git rm -f .github/workflows/_once_identity_cli.yml scripts/_once_identity_cli.patch
          git commit -m "$(cat <<'EOF'
          fix(git): wire identity resolve into CLI and tests

          git-identity set uses token/origin fallbacks; setup auto-sets a
          placeholder identity. Unit tests cover URL and JSON parsing.
          EOF
          )"
          git push

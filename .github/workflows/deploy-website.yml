# Deploy the static product site (website/) to GitHub Pages via Actions.
# One-time: Settings → Pages → Source = "GitHub Actions"
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "branding/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          # Decode raster brand kit shipped as base64 packs/sidecars (binary-safe)
          if [[ -f branding/decode_assets.py ]]; then
            python3 branding/decode_assets.py
          fi
          # Static site root = website/ (no build step)
          cp -a website/. _site/
          # Canonical brand files from branding/ (overwrite if present)
          if [[ -d branding ]]; then
            cp -f branding/favicon.png branding/favicon.svg branding/favicon-32.png \
              branding/logo-horizontal.png branding/icon.png branding/icon-256.png \
              branding/apple-touch-icon.png branding/og.jpg branding/palette.jpg \
              _site/assets/
            if [[ -f branding/x-banner.jpg ]]; then
              cp -f branding/x-banner.jpg _site/assets/
            fi
          fi
          # Avoid Jekyll processing on Pages
          touch _site/.nojekyll
          # Drop internal docs from public site
          rm -f _site/README.md
          ls -la _site _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

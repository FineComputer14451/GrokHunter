# Deploy the static product site (website/) to GitHub Pages via Actions.
# One-time: Settings → Pages → Source = "GitHub Actions"
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "branding/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail

          mkdir -p _site/assets

          # Decode raster brand kit shipped as base64 packs/sidecars (binary-safe)
          if [[ -f branding/decode_assets.py ]]; then
            python3 branding/decode_assets.py
          fi

          # Static site root = website/ (no build step)
          cp -a website/. _site/

          # Canonical brand files from branding/ — only copy what exists
          # (avoids hard-fail when optional assets like palette.jpg are absent)
          if [[ -d branding ]]; then
            declare -a brand_assets=(
              favicon.png
              favicon.svg
              favicon-32.png
              logo-horizontal.png
              icon.png
              icon-256.png
              apple-touch-icon.png
              og.jpg
              palette.jpg
              x-banner.jpg
              wolf-side-transparent.png
            )
            for f in "${brand_assets[@]}"; do
              if [[ -f "branding/${f}" ]]; then
                cp -f "branding/${f}" _site/assets/
                echo "  + branding/${f}"
              else
                echo "  · skipped (missing): branding/${f}"
              fi
            done
          fi

          # Avoid Jekyll processing on Pages
          touch _site/.nojekyll

          # Drop internal docs from public site
          rm -f _site/README.md

          echo
          echo "=== _site layout ==="
          ls -la _site
          echo
          echo "=== _site/assets ==="
          ls -la _site/assets

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

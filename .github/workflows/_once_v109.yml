name: once-v109

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply 1.0.9, tag, release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git apply scripts/_once_v109.patch
          git config user.name "Fine_Computer_4451"
          git config user.email "119702188+FineComputer14451@users.noreply.github.com"
          git add CHANGELOG.md README.md VERSION bin/grokhunter config/profile.d/grokhunter.sh docs/GROK-BUILD-1.0.md install.sh website/index.html
          git rm -f .github/workflows/_once_v109.yml scripts/_once_v109.patch
          git commit -m "$(cat <<'EOF'
          release: GrokHunter 1.0.9 — doctor truth + GitHub identity

          Bump VERSION, changelog, site, profile, and overlay cache to 1.0.9 /
          2026.2.13. Ships doctor HTTPS/os-release fixes and git-identity
          resolution without gh.
          EOF
          )"
          git tag -a v1.0.9 -m "GrokHunter 1.0.9 — doctor truth + GitHub identity"
          git push origin HEAD:main
          git push origin v1.0.9
          gh release create v1.0.9 --title "GrokHunter 1.0.9 — doctor truth + GitHub identity" --notes "$(cat <<'EOF'
          ## GrokHunter 1.0.9

          Doctor stops treating a working lab as offline or incomplete. Git commits attach to GitHub instead of `invalid-email-address`. Overlay cache **2026.2.13**.

          ### Highlights
          - **Doctor HTTPS** — probe `api.x.ai/v1/models`; 401/403 count as reachable
          - **Doctor OS** — missing `/etc/os-release` is a warning; also reads `/usr/lib/os-release`
          - **git-identity** — `set` from gh, `GH_TOKEN`, or GitHub origin owner (no gh CLI required)
          - **setup** — auto-sets placeholder identity when a source works
          - **status** — V9 `models=yes` for current and legacy markers

          ### Upgrade
          ```bash
          cd ~/GrokHunter && git pull
          bash install.sh --overlay-only --with-completions
          grokhunter ensure
          grokhunter skills install
          grokhunter git-identity set
          grokhunter doctor
          ```

          **Site:** https://finecomputer14451.github.io/GrokHunter/  
          **Requires:** Grok Build **1.0.5+** · Grok **4.6** · unrooted Android + Termux

          Not affiliated with xAI, Offensive Security, Termux, or jorexdeveloper — we credit and depend on their work.
          EOF
          )"

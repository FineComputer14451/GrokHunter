# One-shot: apply lab-specialists patch then self-delete.
name: apply-lab-specialists
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply format-patch and push
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, pathlib
          raw = pathlib.Path(".github/patches/lab-specialists.b64").read_text()
          pathlib.Path("/tmp/lab.patch").write_bytes(
              gzip.decompress(base64.b64decode("".join(raw.split())))
          )
          PY
          git config user.name "Fine_Computer_4451"
          git config user.email "119702188+FineComputer14451@users.noreply.github.com"
          git am /tmp/lab.patch
          git rm -f .github/workflows/apply-lab-specialists.yml .github/patches/lab-specialists.b64
          git commit -m "chore: remove one-shot apply-lab-specialists workflow"
          git push

# GrokHunter Rootless — Grok Build 1.0.5+ pair-programming profile
# Applied by scripts/install_grok_profile.sh (does not wipe custom [model.*] blocks).
# Docs: https://docs.x.ai/build/settings · changelog: https://x.ai/build/changelog

[hints]
worktree_tip_dismissed = true

[features]
telemetry = false
feedback = true
codebase_indexing = true
remote_fetch = true
lsp_tools = false

[telemetry]
trace_upload = false
otel_enabled = false
otel_metrics_exporter = "none"
otel_logs_exporter = "none"

[cli]
installer = "internal"
auto_update = true
show_tips = true
# Grok Build 1.0.x ships as stable (was alpha during 0.2.x)
channel = "stable"

[ui]
# Mobile + coding: fullscreen TUI, compact chrome, fast approvals
screen_mode = "fullscreen"
max_thoughts_width = 100
# Secondary model for forks / side tasks (must be a real catalog id)
fork_secondary_model = "grok-4.6"
# Sticky across --force (reset with --force-ui). Template never sets yolo=true.
yolo = false
compact_mode = true
permission_mode = "always-approve"
theme = "groknight"
combine_queued_prompts = true
show_thinking_blocks = true
group_tool_verbs = true
page_flip_on_send = true

[ui.display_refresh]
auto_cadence_enabled = true

[models]
# Grok Build 1.0.5 defaults: coding on grok-4.6 (catalog id)
default = "grok-4.6"
web_search = "grok-4.6"
default_reasoning_effort = "high"

[subagents]
# Workflows + Coding Team agents (benjamin/lucas/harper) need subagents on
enabled = true

# Pair-programming defaults for the lab:
# - Keep edits small and reversible on rootless NetHunter
# - Prefer grok inspect / doctor for environment checks
# - Skills: ~/.grok/skills  · Agents: ~/.grok/agents

# GrokHunter Rootless — pair-programming optimized Grok Build profile
# Merged carefully by install (does not wipe custom [model.*] blocks).

[hints]
worktree_tip_dismissed = true

[features]
telemetry = false

[telemetry]
trace_upload = false
otel_enabled = false
otel_metrics_exporter = "none"
otel_logs_exporter = "none"

[cli]
installer = "internal"
auto_update = true
show_tips = true
channel = "alpha"

[ui]
# Mobile + coding: compact fullscreen, fast approval, pair-friendly
screen_mode = "fullscreen"
max_thoughts_width = 100
fork_secondary_model = "grok-build"
yolo = false
compact_mode = true
permission_mode = "always-approve"
theme = "groknight"
combine_queued_prompts = true

[ui.display_refresh]
auto_cadence_enabled = true

[models]
# Prefer strong reasoning for code quality on device
default = "grok-4.5"
default_reasoning_effort = "high"

# Pair-programming defaults (when supported by the client)
# Keep edits small, explain intent, prefer reversible changes
